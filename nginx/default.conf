server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    # 1. Điều hướng API
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Serve avatar trực tiếp từ volume (tránh phải restart Docker sau khi upload)
    location /images/avatars/ {
        alias /usr/share/nginx/html/images/avatars/;
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # Serve ảnh minh họa bài học từ volume
    location /images/chapters/ {
        alias /usr/share/nginx/html/images/chapters/;
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # 3. Điều hướng Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ Router của Vue.js
        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
    }
}