services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Quangminh1@
      MYSQL_DATABASE: treasure_hunt
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pQuangminh1@"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    volumes:
      # FIX 1: Giúp Backend ghi ảnh trực tiếp vào máy thật (Host)
      # Giả sử WORKDIR trong Dockerfile backend là /app
      - ./frontend/public/images/avatars:/app/public/images/avatars
      - ./frontend/public/images/chapters:/app/public/images/chapters
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    # FIX 2: Đồng bộ thư mục ảnh để Vue thấy ảnh mới ngay lập tức mà không cần build lại
    volumes:
      - ./frontend/public/images/avatars:/usr/share/nginx/html/images/avatars:ro

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # FIX 3: Ánh xạ chứng chỉ SSL từ VPS vào container (Nếu đã có chứng chỉ)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Phục vụ ảnh trực tiếp từ máy thật qua cổng 80/443
      - ./frontend/public/images/avatars:/usr/share/nginx/html/images/avatars:ro
      - ./frontend/public/images/chapters:/usr/share/nginx/html/images/chapters:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data: